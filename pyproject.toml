[project]
name = "torch-sql"
version = "0.1.0rc2"
description = "PyTorch programs as SQL on XQL (prototype)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Alex Merose", email = "al@merose.com" }]
requires-python = ">=3.12"
keywords = ["pytorch", "sql", "duckdb", "datafusion", "autodiff"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.15",
    "numpy>=1.26",
    "pyarrow>=21",
    "ddxdb>=0.4.10,<0.5",
]

[project.urls]
Homepage = "https://github.com/xqlsystems/torch-sql"
Documentation = "https://github.com/xqlsystems/torch-sql/blob/main/docs/design.md"
Issues = "https://github.com/xqlsystems/torch-sql/issues"

[project.optional-dependencies]
# The engines (design §12.3). At least one is needed to run anything.
datafusion = ["ddxdb[datafusion]>=0.4.10,<0.5"]
duckdb = ["ddxdb[duckdb]>=0.4.10,<0.5"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.14,<0.15",
    "expecttest",
    "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = [".hypothesis"]

[tool.hatch.build.targets.wheel]
packages = ["src/torch_sql"]

[tool.uv]
default-groups = ["dev"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "pinned: a shrunk finding of the property-based tests (tests/fuzz)",
]

[tool.ruff]
line-length = 100
# nanoGPT's model.py is a copy kept unchanged.
extend-exclude = ["docs/spikes", "tests/nanogpt"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
